<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CycleLearn</title>
    <style>
      :root {
        --bg: #f8f9fc;
        --panel: #ffffff;
        --line: #e9ecf3;
        --text: #1f2430;
        --muted: #7f8797;
        --accent: #d85a7f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "PingFang SC", "SF Pro Text", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 8px 22px rgba(0,0,0,.04);
        padding: 18px;
      }
      h1,h2,h3,p { margin: 0; }
      h1 { font-size: 1.55rem; margin-bottom: 14px; }
      h2 { font-size: 1.15rem; margin-bottom: 12px; }
      .stack { display: grid; gap: 14px; }
      label { display: grid; gap: 6px; color: #495066; font-size: .92rem; }
      input, button {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }
      button { cursor: pointer; }
      .primary {
        border-color: #f4ccd8;
        background: linear-gradient(#fff3f7,#ffe8ef);
      }
      .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .muted { color: var(--muted); font-size: .9rem; }
      .hidden { display: none !important; }

      .stats {
        margin-top: 8px;
        border: 1px solid #f0d7df;
        background: #fff6f9;
        border-radius: 12px;
        padding: 10px;
        color: #7d3f52;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0,1fr));
        gap: 8px;
      }
      .weekday, .day {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        min-height: 76px;
        padding: 6px;
      }
      .weekday {
        min-height: auto;
        text-align: center;
        font-size: .82rem;
        color: var(--muted);
        background: #fbfcff;
      }
      .day {
        position: relative;
        cursor: pointer;
        transition: .15s;
      }
      .day:hover { transform: translateY(-1px); }
      .day.out { opacity: .35; }
      .day.period {
        border-color: #f3bfce;
        background: #fff3f7;
      }
      .day.predicted {
        border-style: dashed;
        border-color: #f0a8bd;
      }
      .num { font-size: .85rem; color: #5e6575; }
      .heart {
        position: absolute;
        right: 8px;
        bottom: 6px;
        color: #e24e7f;
        font-size: 1rem;
      }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 6px; }

      .record-list { margin-top: 14px; display: grid; gap: 8px; }
      .record-item {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="app stack">
      <section id="page-add" class="stack">
        <h1>新增记录</h1>
        <article class="card stack">
          <form id="form" class="stack">
            <label>
              开始日期
              <input type="date" id="startDate" required />
            </label>
            <label>
              <span><input type="checkbox" id="isEnded" /> 已结束</span>
            </label>
            <label id="endWrap" class="hidden">
              结束日期
              <input type="date" id="endDate" />
            </label>
            <div class="btn-row">
              <button type="submit" class="primary">保存</button>
              <button type="button" id="toRecords">跳转全部记录</button>
            </div>
          </form>
          <div class="stats" id="predictionText">学习中：请先记录至少 2 次开始日期。</div>
        </article>
      </section>

      <section id="page-records" class="hidden stack">
        <div class="toolbar">
          <h2>全部记录</h2>
          <div class="btn-row">
            <button id="prevMonth" type="button">上个月</button>
            <button id="nextMonth" type="button">下个月</button>
            <button id="backAdd" type="button">返回新增记录</button>
          </div>
        </div>
        <article class="card stack">
          <h3 id="monthTitle"></h3>
          <div class="calendar-grid" id="calendar"></div>
          <div class="legend muted">
            <span><i class="dot" style="background:#ffdbe6"></i>经期</span>
            <span><i class="dot" style="background:#fff;border:1px dashed #f0a8bd"></i>预测经期</span>
            <span>点击日期可切换 ❤️</span>
          </div>
        </article>
        <article class="card">
          <h3>详细记录</h3>
          <div id="recordList" class="record-list"></div>
        </article>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "cyclelearn_entries";
      const HEART_KEY = "cyclelearn_hearts";
      const form = document.getElementById("form");
      const startInput = document.getElementById("startDate");
      const endInput = document.getElementById("endDate");
      const endedCheckbox = document.getElementById("isEnded");
      const endWrap = document.getElementById("endWrap");
      const predictionText = document.getElementById("predictionText");
      const pageAdd = document.getElementById("page-add");
      const pageRecords = document.getElementById("page-records");
      const toRecordsBtn = document.getElementById("toRecords");
      const backAddBtn = document.getElementById("backAdd");
      const monthTitle = document.getElementById("monthTitle");
      const calendar = document.getElementById("calendar");
      const recordList = document.getElementById("recordList");
      const prevMonthBtn = document.getElementById("prevMonth");
      const nextMonthBtn = document.getElementById("nextMonth");

      let viewing = new Date();

      const format = (iso) => {
        const d = new Date(iso + "T00:00:00");
        return new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "short", day: "numeric" }).format(d);
      };

      const isoFromDate = (date) => {
        const d = new Date(date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 10);
      };

      const addDays = (iso, days) => {
        const d = new Date(iso + "T00:00:00");
        d.setDate(d.getDate() + days);
        return isoFromDate(d);
      };

      const daysBetween = (a, b) => {
        const n = (new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000;
        return Math.round(n);
      };

      const readJSON = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed ?? fallback;
        } catch {
          return fallback;
        }
      };

      const entries = () => readJSON(STORAGE_KEY, []);
      const hearts = () => readJSON(HEART_KEY, {});
      const saveEntries = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      const saveHearts = (data) => localStorage.setItem(HEART_KEY, JSON.stringify(data));

      const getStats = () => {
        const list = [...entries()].sort((x, y) => x.startDate.localeCompare(y.startDate));
        if (!list.length) return { list, predictedStart: null, predictedLength: 5, avgCycle: null };

        const validLengths = list
          .filter((e) => e.endDate)
          .map((e) => daysBetween(e.startDate, e.endDate) + 1)
          .filter((n) => n > 0 && n < 15);
        const predictedLength = validLengths.length
          ? Math.round(validLengths.reduce((s, v) => s + v, 0) / validLengths.length)
          : 5;

        const cycles = [];
        for (let i = 1; i < list.length; i += 1) {
          const gap = daysBetween(list[i - 1].startDate, list[i].startDate);
          if (gap >= 18 && gap <= 45) cycles.push(gap);
        }

        let avgCycle = null;
        if (cycles.length) {
          // 学习能力：越新的周期权重越高，自动跟随长期变化
          const weighted = cycles.map((v, i) => ({ v, w: i + 1 }));
          const sumW = weighted.reduce((s, item) => s + item.w, 0);
          const sumVW = weighted.reduce((s, item) => s + item.v * item.w, 0);
          avgCycle = Math.round(sumVW / sumW);
        }

        const lastStart = list[list.length - 1].startDate;
        const predictedStart = avgCycle ? addDays(lastStart, avgCycle) : null;

        return { list, predictedStart, predictedLength, avgCycle };
      };

      const predictionRange = () => {
        const { predictedStart, predictedLength } = getStats();
        if (!predictedStart) return [];
        return Array.from({ length: predictedLength }, (_, i) => addDays(predictedStart, i));
      };

      const periodDaysSet = () => {
        const set = new Set();
        entries().forEach((e) => {
          if (!e.endDate) {
            set.add(e.startDate);
            return;
          }
          const len = Math.max(0, daysBetween(e.startDate, e.endDate));
          for (let i = 0; i <= len; i += 1) set.add(addDays(e.startDate, i));
        });
        return set;
      };

      const renderPrediction = () => {
        const { predictedStart, predictedLength, avgCycle } = getStats();
        if (!predictedStart) {
          predictionText.textContent = "学习中：请先记录至少 2 次开始日期。";
          return;
        }
        predictionText.textContent = `已学习你的规律：平均周期约 ${avgCycle} 天。预计下次在 ${format(predictedStart)} 开始，持续约 ${predictedLength} 天。`;
      };

      const renderRecordList = () => {
        const list = [...entries()].sort((a, b) => b.startDate.localeCompare(a.startDate));
        if (!list.length) {
          recordList.innerHTML = `<p class="muted">暂无记录</p>`;
          return;
        }
        recordList.innerHTML = list
          .map((e) => {
            const end = e.endDate ? format(e.endDate) : "未结束";
            return `<article class="record-item"><strong>${format(e.startDate)}</strong> → ${end}</article>`;
          })
          .join("");
      };

      const showPage = (mode) => {
        const records = mode === "records";
        pageAdd.classList.toggle("hidden", records);
        pageRecords.classList.toggle("hidden", !records);
        if (records) {
          renderCalendar();
          renderRecordList();
        }
      };

      const renderCalendar = () => {
        const y = viewing.getFullYear();
        const m = viewing.getMonth();
        monthTitle.textContent = `${y} 年 ${m + 1} 月`;
        calendar.innerHTML = "";

        ["一", "二", "三", "四", "五", "六", "日"].forEach((w) => {
          const d = document.createElement("div");
          d.className = "weekday";
          d.textContent = w;
          calendar.appendChild(d);
        });

        const first = new Date(y, m, 1);
        const startWeekIndex = (first.getDay() + 6) % 7;
        const gridStart = new Date(y, m, 1 - startWeekIndex);

        const periodSet = periodDaysSet();
        const predictedSet = new Set(predictionRange());
        const heartMap = hearts();

        for (let i = 0; i < 42; i += 1) {
          const d = new Date(gridStart);
          d.setDate(d.getDate() + i);
          const iso = isoFromDate(d);
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "day";
          if (d.getMonth() !== m) cell.classList.add("out");
          if (periodSet.has(iso)) cell.classList.add("period");
          if (predictedSet.has(iso)) cell.classList.add("predicted");
          cell.innerHTML = `<span class="num">${d.getDate()}</span>${heartMap[iso] ? '<span class="heart">❤</span>' : ""}`;

          cell.addEventListener("click", () => {
            const latest = hearts();
            latest[iso] = !latest[iso];
            if (!latest[iso]) delete latest[iso];
            saveHearts(latest);
            renderCalendar();
          });

          calendar.appendChild(cell);
        }
      };

      endedCheckbox.addEventListener("change", () => {
        endWrap.classList.toggle("hidden", !endedCheckbox.checked);
        if (!endedCheckbox.checked) endInput.value = "";
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const startDate = startInput.value;
        const hasEnd = endedCheckbox.checked;
        const endDate = hasEnd ? endInput.value : "";

        if (!startDate) return;
        if (hasEnd && !endDate) {
          alert("勾选已结束后，请填写结束日期。");
          return;
        }
        if (hasEnd && endDate < startDate) {
          alert("结束日期不能早于开始日期。");
          return;
        }

        const list = entries();
        list.push({ startDate, endDate });
        saveEntries(list);
        form.reset();
        endWrap.classList.add("hidden");
        renderPrediction();
      });

      toRecordsBtn.addEventListener("click", () => showPage("records"));
      backAddBtn.addEventListener("click", () => showPage("add"));
      prevMonthBtn.addEventListener("click", () => {
        viewing = new Date(viewing.getFullYear(), viewing.getMonth() - 1, 1);
        renderCalendar();
      });
      nextMonthBtn.addEventListener("click", () => {
        viewing = new Date(viewing.getFullYear(), viewing.getMonth() + 1, 1);
        renderCalendar();
      });

      renderPrediction();
      showPage("add");
    </script>
  </body>
</html>
